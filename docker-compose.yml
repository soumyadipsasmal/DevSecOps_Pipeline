services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devsecops-app

    ports:
      - "${APP_PORT:-3007}:3007"

    # The admin session secret is read from your shell or from a .env file next
    # to docker-compose.yml, never from this file. The placeholder below exists
    # only so `docker compose up` works locally; it is under the 32 characters
    # the app requires in production, so a deployment that forgets to set a real
    # value refuses to start instead of signing cookies with a known key.
    #
    #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
    environment:
      PORT: 3007
      # Inside the compose network the database is always reachable as "db:5432".
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: medium_clone
      DB_USER: medium_user
      DB_PASSWORD: medium_pass
      # Set this to a Neon (or any URL-form) PostgreSQL connection string to
      # use it instead of the local "db" service. Blank falls back to the
      # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD values above, so an
      # unset variable keeps today's behaviour exactly.
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: devsecops-development-secret
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-in-production}
      # Open-data integrations (Wikidata / Commons / OSM / RSS). All optional:
      # every one has a working default in app/config.js, and an empty string
      # from ${VAR:-} simply selects that default. CONTACT_EMAIL is the public
      # contact address Wikimedia's API policy asks client software to send.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SITE_URL: ${SITE_URL:-}
      OSM_TILE_URL: ${OSM_TILE_URL:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      EXTERNAL_FETCH_TIMEOUT_MS: ${EXTERNAL_FETCH_TIMEOUT_MS:-}
      # Open-data automatic safety switches + breaker tuning. Each one has a
      # working default in app/config.js; an empty string selects the default.
      ENABLE_WIKIDATA: ${ENABLE_WIKIDATA:-}
      ENABLE_COMMONS: ${ENABLE_COMMONS:-}
      ENABLE_MAPS: ${ENABLE_MAPS:-}
      ENABLE_RSS: ${ENABLE_RSS:-}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-}
      CB_WINDOW_MINUTES: ${CB_WINDOW_MINUTES:-}
      CB_MIN_REQUESTS: ${CB_MIN_REQUESTS:-}
      CB_FAILURE_RATE_PERCENT: ${CB_FAILURE_RATE_PERCENT:-}
      CB_COOLDOWN_MS: ${CB_COOLDOWN_MS:-}
      CB_MAX_COOLDOWN_MS: ${CB_MAX_COOLDOWN_MS:-}
      CB_FORBIDDEN_DAILY_MAX: ${CB_FORBIDDEN_DAILY_MAX:-}
      CB_EVENT_RETENTION_DAYS: ${CB_EVENT_RETENTION_DAYS:-}
      NOMINATIM_HOURLY_LIMIT: ${NOMINATIM_HOURLY_LIMIT:-}
      NOMINATIM_DAILY_LIMIT: ${NOMINATIM_DAILY_LIMIT:-}
      WIKIDATA_HOURLY_LIMIT: ${WIKIDATA_HOURLY_LIMIT:-}
      WIKIDATA_DAILY_LIMIT: ${WIKIDATA_DAILY_LIMIT:-}
      COMMONS_HOURLY_LIMIT: ${COMMONS_HOURLY_LIMIT:-}
      COMMONS_DAILY_LIMIT: ${COMMONS_DAILY_LIMIT:-}
      RSS_HOURLY_LIMIT: ${RSS_HOURLY_LIMIT:-}
      RSS_DAILY_LIMIT: ${RSS_DAILY_LIMIT:-}
      RSS_MIN_INTERVAL_MS: ${RSS_MIN_INTERVAL_MS:-}
      MAP_TILE_HEALTHCHECK_MS: ${MAP_TILE_HEALTHCHECK_MS:-}
      MAP_TILE_HOURLY_LIMIT: ${MAP_TILE_HOURLY_LIMIT:-}
      MAP_TILE_DAILY_LIMIT: ${MAP_TILE_DAILY_LIMIT:-}
      # SEO engine & redirects. Deterministic analyzer switches; empty selects
      # the defaults in app/config.js (engine on, 5 related-story suggestions).
      ENABLE_SEO_ENGINE: ${ENABLE_SEO_ENGINE:-}
      SEO_INTERNAL_LINK_LIMIT: ${SEO_INTERNAL_LINK_LIMIT:-}
      # --- Process / reverse proxy ---------------------------------------------
      # NODE_ENV=production turns on the app's production safety gates: a strong
      # ADMIN_SESSION_SECRET becomes required, admin cookies default to Secure,
      # and DATABASE_URL is required (the non-TLS DB_* fallback is dev-only).
      # Unset becomes "development" here so the container never boots with an
      # empty NODE_ENV; deploy with NODE_ENV=production and a real DATABASE_URL.
      # ADMIN_COOKIE_SECURE forces the Secure flag explicitly when the site is
      # behind HTTPS but NODE_ENV is unset. TRUST_PROXY is only for a trusted
      # reverse proxy in front of the app (login rate limiting reads the client
      # IP). Empty strings select the app defaults.
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # --- Monetization / analytics ---------------------------------------------
      # ANALYTICS_SALT HMACs client addresses in the click/event logs; the
      # newsletter settings configure the sender a future provider would use.
      # GA4 stays OFF unless ENABLE_ANALYTICS and a valid GA_MEASUREMENT_ID are
      # both set, and even then it waits for advertising consent. Empty strings
      # keep today's behaviour: no hashing, no analytics.
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
      NEWSLETTER_PROVIDER: ${NEWSLETTER_PROVIDER:-}
      NEWSLETTER_FROM_EMAIL: ${NEWSLETTER_FROM_EMAIL:-}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # Image seeding: the image ships scripts/topic-images.tsv at
      # /seed-data/topic-images.tsv (see Dockerfile). app/article-images.js
      # resolves the TSV via IMAGE_TSV first, so point it there explicitly.
      IMAGE_TSV: ${IMAGE_TSV:-/seed-data/topic-images.tsv}

    # Uploaded banners live in the image filesystem by default. Mount a volume
    # here so CMS images survive a rebuild in a deployed environment.
    volumes:
      - uploads:/frontend/assets/uploads

    healthcheck:
      # /health answers 200 only when the app can run a real database query
      # (SELECT NOW()), so this checks true readiness, not plain process
      # liveness. Uses node's built-in fetch; node:22-alpine ships no curl.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3007/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine

    container_name: devsecops-compose-db

    environment:
      POSTGRES_DB: medium_clone
      POSTGRES_USER: medium_user
      POSTGRES_PASSWORD: medium_pass

    # Published for local tooling (psql, migrations run outside the container).
    # app/.env must use this same host port. Override with DB_HOST_PORT if 5434
    # is already taken on your machine.
    ports:
        - "${DB_HOST_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-categories.sql:/docker-entrypoint-initdb.d/02-seed-categories.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./database/seed-topics.sql:/docker-entrypoint-initdb.d/04-seed-topics.sql:ro
      - ./database/schema-article-images.sql:/docker-entrypoint-initdb.d/05-article-images.sql:ro
      - ./database/fix-article-categories.sql:/docker-entrypoint-initdb.d/06-fix-categories.sql:ro
      - ./database/seed-editorial-2026.sql:/docker-entrypoint-initdb.d/07-seed-editorial-2026.sql:ro
      - ./database/schema-admin-auth.sql:/docker-entrypoint-initdb.d/08-admin-auth.sql:ro
      - ./database/schema-article-cms.sql:/docker-entrypoint-initdb.d/09-article-cms.sql:ro
      # Ad placements and monetization settings. Creates two tables and seeds
      # every placement disabled with no publisher id, so a fresh volume is not
      # monetised.
      - ./database/schema-ad-placements.sql:/docker-entrypoint-initdb.d/10-ad-placements.sql:ro
      # Open-data cache (Wikidata / Commons / Nominatim) and the reviewed RSS
      # headline store. Both tables start empty; nothing is seeded.
      - ./database/schema-external-data.sql:/docker-entrypoint-initdb.d/11-external-data.sql:ro
      # Open-data automatic safety: per-service breaker state and the event log
      # that records every automatic stop and every admin override. Empty at
      # first boot; each service writes its row the first time it is used.
      - ./database/schema-integration-safety.sql:/docker-entrypoint-initdb.d/12-integration-safety.sql:ro
      # Editorial citations and research provenance. Two new tables attached to
      # articles; nothing already in the database is read or rewritten.
      - ./database/schema-research-sources.sql:/docker-entrypoint-initdb.d/13-research-sources.sql:ro
      # Monetization dashboard. Storage only: affiliate links, sponsored
      # campaigns, direct-ads campaigns, newsletter subscribers, disclosure
      # texts and the audit log all start empty, and the two existing-table
      # changes are additive defaults — KaliNova remains unmonetised.
      - ./database/schema-monetization.sql:/docker-entrypoint-initdb.d/14-monetization.sql:ro
      # SEO engine & redirects. One new table for slug-change/retired URLs; it
      # starts empty. Nothing in the schema touches an existing table.
      - ./database/schema-seo-engine.sql:/docker-entrypoint-initdb.d/15-seo-engine.sql:ro
      # SEO master data. Additive columns for per-entity metadata (articles,
      # categories, authors), article excerpt/focus keyword/scheduling, and the
      # widened draft/published/scheduled/archived status model. Nothing is
      # dropped or re-seeded; existing rows keep their current behaviour.
      - ./database/schema-seo-master.sql:/docker-entrypoint-initdb.d/16-seo-master.sql:ro
      # SEO content taxonomy. Two new tables (tags, article_tags) start empty;
      # nothing existing is read or rewritten. Backs /tag/<slug> and search.
      - ./database/schema-seo-content.sql:/docker-entrypoint-initdb.d/17-seo-content.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medium_user -d medium_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
