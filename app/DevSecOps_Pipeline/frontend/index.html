<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevBlog — Read. Write. Share.</title>
<meta name="description" content="DevBlog is a publishing platform for developers, DevOps engineers, and technologists to read and share ideas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="/" class="logo" aria-label="DevBlog home">
        <span class="logo-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="logo-word">DevBlog</span>
      </a>
    </div>

    <div class="header-search">
      <form role="search" class="search-form" id="search-form">
        <label for="site-search" class="sr-only">Search articles, authors, and topics</label>
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="site-search" name="q" placeholder="Search DevBlog" autocomplete="off">
      </form>
      <div class="search-results" id="search-results" hidden></div>
    </div>

    <nav class="header-right" aria-label="Primary">
      <button class="btn btn-ghost btn-icon-text" id="write-btn" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Write</span>
      </button>

      <button class="btn btn-text" id="signin-btn" type="button">Sign In</button>
      <button class="btn btn-primary" id="getstarted-btn" type="button">Get Started</button>

      <div class="user-menu" id="user-menu" hidden>
        <button class="avatar-btn" id="user-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <img src="https://i.pravatar.cc/64?img=12" alt="" class="avatar avatar-sm">
        </button>
        <div class="user-menu-panel" id="user-menu-panel" hidden role="menu">
          <a href="#profile" role="menuitem">Profile</a>
          <a href="#drafts" role="menuitem">Drafts</a>
          <a href="#reading-list" role="menuitem">Reading list</a>
          <hr>
          <button type="button" role="menuitem" id="logout-btn">Sign out</button>
        </div>
      </div>
    </nav>

    <button class="mobile-toggle" id="mobile-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- TOPIC NAV -->
  <nav class="topic-nav" aria-label="Topics">
    <ul id="topic-list">
      <li><button class="topic-chip is-active" data-topic="for-you">For You</button></li>
      <li><button class="topic-chip" data-topic="technology">Technology</button></li>
      <li><button class="topic-chip" data-topic="programming">Programming</button></li>
      <li><button class="topic-chip" data-topic="devops">DevOps</button></li>
      <li><button class="topic-chip" data-topic="cloud">Cloud</button></li>
      <li><button class="topic-chip" data-topic="ai">AI</button></li>
      <li><button class="topic-chip" data-topic="cybersecurity">Cybersecurity</button></li>
      <li><button class="topic-chip" data-topic="docker">Docker</button></li>
      <li><button class="topic-chip" data-topic="kubernetes">Kubernetes</button></li>
      <li><button class="topic-chip" data-topic="aws">AWS</button></li>
      <li><button class="topic-chip" data-topic="web-development">Web Development</button></li>
    </ul>
  </nav>
</header>

<!-- Mobile drawer -->
<div class="mobile-drawer" id="mobile-drawer" hidden>
  <button class="btn btn-ghost btn-icon-text" id="mobile-write-btn" type="button">Write</button>
  <button class="btn btn-text" id="mobile-signin-btn" type="button">Sign In</button>
  <button class="btn btn-primary" id="mobile-getstarted-btn" type="button">Get Started</button>
</div>

<!-- ============ MAIN ============ -->
<main id="main-content">
  <div class="layout">

    <!-- FEED -->
    <div class="feed">

      <section class="feed-section" aria-labelledby="featured-heading">
        <h2 class="feed-heading" id="featured-heading">Featured stories</h2>
        <div class="featured-grid" id="featured-grid"></div>
      </section>

      <section class="feed-section" aria-labelledby="recommended-heading">
        <div class="feed-heading-row">
          <h2 class="feed-heading" id="recommended-heading">Recommended for you</h2>
        </div>
        <div class="article-list" id="recommended-list"></div>
      </section>

      <section class="feed-section" aria-labelledby="latest-heading">
        <h2 class="feed-heading" id="latest-heading">Latest stories</h2>
        <div class="article-list" id="latest-list"></div>
        <button class="btn btn-outline load-more" id="load-more-btn" type="button">Show more stories</button>
      </section>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Trending and authors">

      <section class="side-card" aria-labelledby="trending-heading">
        <h2 class="side-heading" id="trending-heading">Trending on DevBlog</h2>
        <ol class="trending-list" id="trending-list"></ol>
      </section>

      <section class="side-card" aria-labelledby="topics-heading">
        <h2 class="side-heading" id="topics-heading">Trending topics</h2>
        <div class="topic-pill-cloud" id="topic-cloud"></div>
      </section>

      <section class="side-card" aria-labelledby="authors-heading">
        <h2 class="side-heading" id="authors-heading">Popular authors</h2>
        <ul class="author-list" id="author-list"></ul>
      </section>

      <p class="side-footnote">DevBlog &copy; 2026 · Built for developers, by developers.</p>
    </aside>

  </div>
</main>

<!-- Templates (used by script.js) -->
<template id="tpl-featured-card">
  <article class="card card-featured">
    <a class="card-media" href="#article">
      <img class="card-img" alt="" loading="lazy">
    </a>
    <div class="card-body">
      <p class="card-eyebrow"></p>
      <h3 class="card-title"><a href="#article"></a></h3>
      <p class="card-desc"></p>
      <div class="card-meta">
        <img class="avatar avatar-xs" alt="">
        <span class="meta-author"></span>
        <span class="meta-dot" aria-hidden="true">&middot;</span>
        <span class="meta-read"></span>
        <span class="meta-dot" aria-hidden="true">&middot;</span>
        <span class="meta-date"></span>
      </div>
    </div>
  </article>
</template>

<template id="tpl-article-row">
  <article class="card card-row">
    <div class="card-body">
      <div class="card-meta card-meta-top">
        <img class="avatar avatar-xs" alt="">
        <span class="meta-author"></span>
        <span class="meta-dot" aria-hidden="true">&middot;</span>
        <span class="meta-date"></span>
      </div>
      <h3 class="card-title"><a href="#article"></a></h3>
      <p class="card-desc"></p>
      <div class="card-footer">
        <p class="card-eyebrow"></p>
        <span class="meta-dot" aria-hidden="true">&middot;</span>
        <span class="meta-read"></span>
        <div class="card-actions">
          <button class="icon-btn bookmark-btn" type="button" aria-pressed="false" aria-label="Bookmark this story">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="icon-btn more-btn" type="button" aria-label="More options">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
      </div>
    </div>
    <a class="card-media card-media-side" href="#article">
      <img class="card-img" alt="" loading="lazy">
    </a>
  </article>
</template>

<template id="tpl-trending-item">
  <li class="trending-item">
    <span class="trending-rank"></span>
    <div class="trending-content">
      <div class="trending-author-row">
        <img class="avatar avatar-xxs" alt="">
        <span class="meta-author"></span>
      </div>
      <h4 class="trending-title"><a href="#article"></a></h4>
    </div>
  </li>
</template>

<template id="tpl-author-item">
  <li class="author-item">
    <img class="avatar avatar-sm" alt="">
    <div class="author-info">
      <span class="author-name"></span>
      <span class="author-bio"></span>
    </div>
    <button class="btn btn-outline btn-sm follow-btn" type="button">Follow</button>
  </li>
</template>

<script src="script.js"></script>
</body>
</html>
