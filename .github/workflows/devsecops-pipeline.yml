name: DevSecOps CI/CD & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_scan:
    name: Code & Secret Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Secret Detection (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          head: ${{ github.sha }}
          extra_args: --debug

  docker_security_scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast_scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devsecops-app:${{ github.sha }}

      - name: Run Trivy Security Scan on Container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'