name: DevSecOps CI/CD & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_scan:
    name: Code & Secret Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Secret Detection (Trufflehog)
        uses: trufflesecurity/trufflehog-credential-action@v3.0.0
        with:
          base: ""
          head: ${{ github.sha }}

  docker_security_scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast_scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devsecops-app:${{ github.sha }}

      - name: Run Trivy Security Scan on Container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Set to 0 temporarily so pipeline doesn't break on initial warnings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'